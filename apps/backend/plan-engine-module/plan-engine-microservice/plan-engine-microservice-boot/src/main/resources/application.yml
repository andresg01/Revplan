server:
  port: 8080

logging:
  config: classpath:config/log4j2/log4j2-local.xml

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5433/revplan
    username: revplan
    password: revplan
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      platform: postgres
      schema-locations: classpath:db/schema-postgres.sql
      data-locations: classpath:db/data-postgres.sql
      mode: always
      continue-on-error: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: admin
      password: test

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  api-rest:
    base-path: /artifact-app/v1

openai:
  apiKey: ${OPENAI_API_KEY:}
  baseUrl: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeoutMs: ${OPENAI_TIMEOUT_MS:15000}
  maxInMemoryBytes: ${OPENAI_MAX_IN_MEMORY_BYTES:2097152}

ai:
  defaults:
    provider: ${AI_DEFAULTS_PROVIDER:openai}
    model: ${AI_DEFAULTS_MODEL:gpt-5-mini}
    temperature: ${AI_DEFAULTS_TEMPERATURE:0.2}
    promptVersion: ${AI_DEFAULTS_PROMPT_VERSION:2025-08-19}
  systemPromptPath: classpath:prompts/financial-planner-system.txt


