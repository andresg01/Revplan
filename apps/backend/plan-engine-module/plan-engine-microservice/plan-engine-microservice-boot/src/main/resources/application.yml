server:
  port: 8080

logging:
  config: classpath:config/log4j2/log4j2-local.xml

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5433/revplan
    username: revplan
    password: revplan
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      platform: postgres
      schema-locations: classpath:db/schema-postgres.sql
      data-locations: classpath:db/data-postgres.sql
      mode: always
      continue-on-error: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: admin
      password: test

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  api-rest:
    base-path: /artifact-app/v1

llm:
  adapter:
    baseUrl: ${LLM_ADAPTER_BASE_URL:http://llm-adapter-ms:8083}
    timeoutMs: ${LLM_ADAPTER_TIMEOUT_MS:90000}
    maxInMemoryBytes: ${LLM_ADAPTER_MAX_IN_MEMORY_BYTES:2097152}
    username: ${LLM_ADAPTER_USERNAME:admin}
    password: ${LLM_ADAPTER_PASSWORD:test}
    path:
      generate: /plans/generate
      stream: /plans/generate/stream
    acceptLanguage: ${LLM_ADAPTER_ACCEPT_LANGUAGE:es-ES}
ai:
  defaults:
    provider: ${AI_DEFAULTS_PROVIDER:openai}
    model: ${AI_DEFAULTS_MODEL:gpt-5-mini}
    temperature: ${AI_DEFAULTS_TEMPERATURE:0.2}
    promptVersion: ${AI_DEFAULTS_PROMPT_VERSION:2025-08-19}
