server:
  port: 8083

# Logging
logging:
  config: classpath:config/log4j2/log4j2-local.xml
  
management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:    
  profiles:
    active: local


  # Spring-security config: Basic security
  security:      
    user: 
      name: admin
      password: test

# Custom config to manage swagger-ui
springdoc:
  swagger-ui:
    # To avoid regenerate specification for api/model service classes autogenerated
    url: /openapi/openapi-rest.yaml 

# Custom App configuraiton            
app:
  api-rest:
    base-path: /artifact-app/v1

openai:
  apiKey: ${OPENAI_API_KEY:}
  baseUrl: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeoutMs: ${OPENAI_TIMEOUT_MS:15000}
  maxInMemoryBytes: ${OPENAI_MAX_IN_MEMORY_BYTES:2097152}

ai:
  systemPromptPath: classpath:prompts/financial-planner-system.txt
#  defaults:
#    provider: ${AI_DEFAULTS_PROVIDER:openai}
#    model: ${AI_DEFAULTS_MODEL:gpt-5-mini}
#    temperature: ${AI_DEFAULTS_TEMPERATURE:0.2}
#    promptVersion: ${AI_DEFAULTS_PROMPT_VERSION:2025-08-19}

fx:
  baseUrl: ${FX_BASE_URL:https://api.frankfurter.app}
  timeoutMs: ${FX_TIMEOUT_MS:10000}