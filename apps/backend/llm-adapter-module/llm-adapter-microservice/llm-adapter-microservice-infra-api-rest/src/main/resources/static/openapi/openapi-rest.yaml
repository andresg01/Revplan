                                  amount: 0.016
                            - modelId: dalle-3
                              matrix:
                                - quality: standard
                                  size: 1024x1024
                                  amount: 0.04
                                - quality: hd
                                  size: 1024x1024
                                  amount: 0.08
                                - quality: standard
                                  size: 1024x1792
                                  amount: 0.08
                                - quality: hd
                                  size: 1024x1792
                                  amount: 0.12
                                - quality: standard
                                  size: 1792x1024
                                  amount: 0.08
                                - quality: hd
                                  size: 1792x1024
                                  amount: 0.12
                            - modelId: dalle-2
                              matrix:
                                - quality: standard
                                  size: 256x256
                                  amount: 0.016
                                - quality: standard
                                  size: 512x512
                                  amount: 0.018
                                - quality: standard
                                  size: 1024x1024
                                  amount: 0.020
                        embeddings:
                          unit: PER_1M_TOKENS
                          items:
                            - modelId: text-embedding-3-small
                              price: { input: 0.01 }
                            - modelId: text-embedding-3-large
                              price: { input: 0.065 }
                            - modelId: text-embedding-ada-002
                              price: { input: 0.05 }
                        moderation:
                          free: true
                          notes: 'omni-moderation sin coste'
                        legacyTextModels:
                          unit: PER_1M_TOKENS
                          items:
                            - modelId: chatgpt-4o-latest
                              price: { input: 5.00, output: 15.00 }
                            - modelId: gpt-4-0125-preview
                              price: { input: 10.00, output: 30.00 }
                            - modelId: gpt-3.5-turbo
                              price: { input: 0.50, output: 1.50 }
                            - modelId: davinci-002
                              price: { input: 2.00, output: 2.00 }
                            - modelId: babbage-002
                              price: { input: 0.40, output: 0.40 }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRequestIdHeader:
      description: Header used to define the identifier of a specific request.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        example: 54b9c11c-9162-45a1-a352-0d95734cd079
    Location:
      required: true
      description: Resource URL created.
      schema:
        type: string
        minLength: 4
        maxLength: 500
        pattern: '^/[A-Za-z0-9_\-/]+$'
        example: /llm-adapter-service/v0/prompts/templates/PLAN_JSON_V1

  parameters:
    Accept-Language-Header:
      name: Accept-Language
      in: header
      required: false
      description: ISO code of the language that the client accepts.
      schema:
        type: string
        default: es-ES
        pattern: '^[a-z]{2}(-[A-Z]{2})?$'
        minLength: 2
        maxLength: 6
        example: es-ES
    X-Request-Id-Header:
      name: X-Request-ID
      in: header
      required: true
      description: Unique identifier for tracing an HTTP request (uuid v4).
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        example: a0eeb5a3-14cf-4f71-b8b3-5a77b54a1f1e
    Template-Id:
      name: templateId
      in: path
      required: true
      description: Identificador MAYUSCULAS y guion bajo.
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^[A-Z0-9_]+$'
        example: PLAN_JSON_V1
    Prompt-Name-Search:
      name: name
      in: query
      required: false
      description: Filtro por nombre/alias (contiene, case-insensitive).
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9 _\-.]+$'
        example: Plan JSON
    Offset:
      name: offset
      in: query
      required: false
      description: The offset for pagination.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    # ======== MODELS ========
    Model:
      type: object
      properties:
        id:
          type: string
          minLength: 2
          maxLength: 128
        provider:
          type: string
          enum: [openai, azure_openai]
        contextWindow:
          type: integer
          minimum: 4096
          maximum: 1048576
        maxOutputTokens:
          type: integer
          minimum: 64
          maximum: 32768
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [text, structured_json]
        status:
          type: string
          enum: [active, deprecated, unavailable]
      required: [id, provider, contextWindow, maxOutputTokens, modalities, status]

    # ======== PROMPTS ========
    PromptVariable:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$'
          example: profile
        type:
          type: string
          enum: [string, number, boolean, object, array]
        required:
          type: boolean
          default: true
        description:
          type: string
          maxLength: 300
      required: [name, type]

    PromptTemplate:
      type: object
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z0-9_]+$'
          example: PLAN_JSON_V1
        name:
          type: string
          minLength: 3
          maxLength: 120
          pattern: '^[A-Za-z0-9 _\-.]+$'
          example: Plan JSON v1
        systemPrompt:
          type: string
          minLength: 10
          maxLength: 20000
          example: 'Eres un planificador financiero. Devuelve JSON EXACTO al schema.'
        userTemplate:
          type: string
          minLength: 10
          maxLength: 20000
          example: |
            PERFIL: {{profile}}
            CUENTAS: {{accounts}}
            GASTO_90D: {{spend}}
            DEUDAS: {{debts}}
            CATALOGO_PLANTILLAS: {{templates}}
            Devuelve SOLO JSON al schema.
        variables:
          type: array
          items: { $ref: '#/components/schemas/PromptVariable' }
        protected:
          type: boolean
          description: Evita borrado/modificación accidental.
          default: false
      required: [id, name, systemPrompt, userTemplate]

    PromptTemplateData:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PromptTemplate' }
      required: [data]

    PromptTemplateListData:
      type: object
      properties:
        data:
          type: array
          minItems: 0
          items: { $ref: '#/components/schemas/PromptTemplate' }
        pagination:
          type: object
          properties:
            offset: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            totalElements: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
            pageNumber: { type: integer, minimum: 0 }

    # ======== PLAN OUTPUT ========
    Envelopes:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
      example:
        fijos: 0.45
        variables: 0.28
        objetivos: 0.27

    PlanAdjustments:
      type: object
      properties:
        saving_pct: { type: number, minimum: 0, maximum: 1 }
        emergency_months: { type: integer, minimum: 0, maximum: 24 }
        envelopes: { $ref: '#/components/schemas/Envelopes' }
      required: [saving_pct, emergency_months]

    PlanLLMOutput:
      type: object
      properties:
        template_id:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z0-9_]+$'
          example: EQUILIBRADO_50_30_20
        adjustments: { $ref: '#/components/schemas/PlanAdjustments' }
        rationale:
          type: string
          minLength: 3
          maxLength: 2000
        alerts:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 300
      required: [template_id, adjustments]

    PlanLLMOutputData:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PlanLLMOutput' }
      required: [data]

    PlanLLMOutputSchemaDoc:
      type: object
      description: Documento JSON Schema completo (para clientes).
      additionalProperties: true
      properties:
        title: { type: string, example: PlanLLMOutput }
        type: { type: string, example: object }

    ResponseFormat:
      type: string
      enum: [json_schema]
      example: json_schema

    GenerationParams:
      type: object
      properties:
        modelId:
          type: string
          minLength: 2
          maxLength: 128
          example: gpt-4o-mini
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.2
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        max_output_tokens:
          type: integer
          minimum: 256
          maximum: 8192
          default: 2048
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
          default: 0
      required: [modelId]

    ValidationTarget:
      type: object
      properties:
        schema:
          type: object
          description: JSON Schema para validar (si no se usa esquema por defecto).
        json:
          type: object
          description: Documento a validar.
      required: [json]

    Error:
      title: Error
      type: object
      description: General structure to represent errors.
      properties:
        messages:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              code:
                type: string
                pattern: '^[A-Z0-9_]+$'
                minLength: 2
                maxLength: 100
                example: UNEXPECTED_ERROR
              message:
                type: string
                minLength: 1
                maxLength: 10000
                example: Unexpected error
              type:
                type: string
                enum: [CRITICAL, FATAL, ERROR, WARNING, INFO]
              description:
                type: string
                minLength: 1
                maxLength: 2000
                example: The server cannot process the request.
            required: [code, message, type, description]
      required: [messages]

    # ======== BILLING / PRICES ========
    PriceUnit:
      type: string
      enum:
        - PER_1M_TOKENS
        - PER_IMAGE
        - PER_CONTAINER
        - PER_GB_DAY
        - PER_2K_CALLS
        - PER_1K_CALLS
        - PER_MINUTE
        - PER_1M_CHARACTERS

    PriceTriple:
      type: object
      description: Precios por 1M tokens (según corresponda).
      properties:
        input: { type: number, minimum: 0 }
        cachedInput: { type: number, minimum: 0 }
        output: { type: number, minimum: 0 }
      additionalProperties: false

    TextModelPrice:
      type: object
      properties:
        modelId:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-.]*$'
          minLength: 2
          maxLength: 64
        price: { $ref: '#/components/schemas/PriceTriple' }
      required: [modelId, price]

    TokensCategory:
      type: object
      properties:
        unit: { $ref: '#/components/schemas/PriceUnit' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TextModelPrice' }
      required: [unit, items]

    FineTuningItem:
      type: object
      properties:
        modelId:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-.]*$'
        trainingHourUSD: { type: number, minimum: 0 }
        trainingPer1MTokensUSD: { type: number, minimum: 0 }
        inference: { $ref: '#/components/schemas/PriceTriple' }
      additionalProperties: false
      anyOf:
        - required: [trainingHourUSD]
        - required: [trainingPer1MTokensUSD]

    BuiltInToolItem:
      type: object
      properties:
        tool:
          type: string
          enum:
            - code_interpreter
            - file_search_storage
            - file_search_tool_call
            - web_search_gpt4o_family
            - web_search_gpt5_o_series
        pricing:
          type: object
          properties:
            unit: { $ref: '#/components/schemas/PriceUnit' }
            amount: { type: number, minimum: 0 }
            notes: { type: string, maxLength: 200 }
          required: [unit, amount]
      required: [tool, pricing]

    TranscriptionSpeechItem:
      type: object
      properties:
        modelId:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-.]*$'
        textTokens: { $ref: '#/components/schemas/PriceTriple' }
        audioTokens: { $ref: '#/components/schemas/PriceTriple' }
        otherUnits:
          type: array
          items:
            type: object
            properties:
              unit: { $ref: '#/components/schemas/PriceUnit' }
              amount: { type: number, minimum: 0 }
            required: [unit, amount]
        estimatedCostPerMinuteUSD: { type: number, minimum: 0 }
      required: [modelId]

    ImageMatrixItem:
      type: object
      properties:
        quality:
          type: string
          enum: [low, medium, high, standard, hd]
        size:
          type: string
          enum:
            - 256x256
            - 512x512
            - 1024x1024
            - 1024x1536
            - 1536x1024
            - 1024x1792
            - 1792x1024
        amount: { type: number, minimum: 0 }
      required: [quality, size, amount]

    ImageGenerationItem:
      type: object
      properties:
        modelId:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-.]*$'
        matrix:
          type: array
          items: { $ref: '#/components/schemas/ImageMatrixItem' }
      required: [modelId, matrix]

    EmbeddingItem:
      type: object
      properties:
        modelId:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-.]*$'
        price:
          type: object
          properties:
            input: { type: number, minimum: 0 }
          required: [input]
      required: [modelId, price]

    PriceCatalog:
      type: object
      properties:
        provider: { type: string, enum: [openai, azure_openai] }
        tier: { type: string, enum: [standard, batch, flex, priority] }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
        effectiveAt: { type: string, format: date-time }
        categories:
          type: object
          properties:
            textTokens: { $ref: '#/components/schemas/TokensCategory' }
            imageTokens: { $ref: '#/components/schemas/TokensCategory' }
            audioTokens: { $ref: '#/components/schemas/TokensCategory' }
            fineTuning:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/FineTuningItem' }
              required: [items]
            builtInTools:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/BuiltInToolItem' }
              required: [items]
            transcriptionSpeech:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/TranscriptionSpeechItem' }
              required: [items]
            imageGeneration:
              type: object
              properties:
                unit: { $ref: '#/components/schemas/PriceUnit' }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ImageGenerationItem' }
              required: [unit, items]
            embeddings:
              type: object
              properties:
                unit: { $ref: '#/components/schemas/PriceUnit' }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/EmbeddingItem' }
              required: [unit, items]
            moderation:
              type: object
              properties:
                free: { type: boolean }
                notes: { type: string, maxLength: 200 }
              required: [free]
            legacyTextModels: { $ref: '#/components/schemas/TokensCategory' }
          required:
            - textTokens
      required: [provider, tier, currency, effectiveAt, categories]

  requestBodies:
    PromptTemplateRequestBody:
      description: Datos completos de la plantilla de prompt.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PromptTemplate' }
          examples:
            sample:
              value:
                id: PLAN_JSON_V1
                name: Plan JSON v1
                systemPrompt: >
                  Eres un planificador financiero. Devuelve SOLO JSON válido
                  EXACTO al schema especificado. No añadas comentarios ni texto fuera del JSON.
                userTemplate: |
                  PERFIL: {{profile}}
                  CUENTAS: {{accounts}}
                  GASTO_90D: {{spend}}
                  DEUDAS: {{debts}}
                  CATALOGO_PLANTILLAS: {{templates}}
                  INSTRUCCIONES: Selecciona la mejor plantilla, ajusta +-5% y devuelve JSON.
                variables:
                  - name: profile
                    type: object
                    required: true
                    description: Perfil financiero agregado
                  - name: accounts
                    type: object
                    required: false
                  - name: spend
                    type: object
                    required: false
                  - name: debts
                    type: object
                    required: false
                protected: true

    JsonValidateRequestBody:
      description: JSON para validar contra un schema (propio o por defecto).
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationTarget' }
          examples:
            sample:
              value:
                schema:
                  type: object
                  properties:
                    foo:
                      type: integer
                      minimum: 0
                  required: [foo]
                json:
                  foo: 3

    PlanGenerateLLMRequestBody:
      description: Solicitud de generación (usa template + variables + schema del plan).
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              templateId:
                type: string
                minLength: 3
                maxLength: 64
                pattern: '^[A-Z0-9_]+$'
                example: PLAN_JSON_V1
              variables:
                type: object
                additionalProperties: true
                description: Mapa con valores para las variables del prompt.
              responseFormat:
                $ref: '#/components/schemas/ResponseFormat'
              schema:
                type: object
                description: JSON Schema alternativo (si se omite, se usa el oficial del plan).
              generation:
                $ref: '#/components/schemas/GenerationParams'
            required: [templateId, variables, responseFormat, generation]
          examples:
            minimal:
              value:
                templateId: PLAN_JSON_V1
                variables:
                  profile:
                    incomeNet: 2500
                    expensesFixed: 1200
                    expensesVariable: 600
                    riskScore: 3
                    liquidityNeed: 0.4
                responseFormat: json_schema
                generation:
                  modelId: gpt-4o-mini
                  temperature: 0.2
                  max_output_tokens: 2048

  responses:
    '204':
      description: No Content.
    '400':
      description: Bad Request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-params:
              value:
                messages:
                  - code: BAD_REQUEST
                    message: Invalid parameters
                    type: ERROR
                    description: Missing required field templateId.
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthorized:
              value:
                messages:
                  - code: UNAUTHORIZED
                    message: Missing or invalid token
                    type: ERROR
                    description: Provide a valid bearer token.
    '404':
      description: Not Found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            not-found:
              value:
                messages:
                  - code: NOT_FOUND
                    message: Resource not found
                    type: FATAL
                    description: Prompt template PLAN_JSON_V1 not found.
    '409':
      description: Conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            conflict:
              value:
                messages:
                  - code: CONFLICT
                    message: Template id already exists
                    type: ERROR
                    description: Use another id.
    '422':
      description: Unprocessable Entity.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            schema-validation-failed:
              value:
                messages:
                  - code: SCHEMA_VALIDATION_FAILED
                    message: Output does not match schema
                    type: ERROR
                    description: adjustments.saving_pct must be <= 1
    '429':
      description: Too Many Requests.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar.
          schema: { type: integer, minimum: 1, example: 10 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            rate-limit:
              value:
                messages:
                  - code: RATE_LIMIT
                    message: Too many requests
                    type: ERROR
                    description: Backoff and retry later.
    '500':
      description: Internal Server Error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            internal:
              value:
                messages:
                  - code: INTERNAL_SERVER_ERROR
                    message: Internal server error
                    type: FATAL
                    description: Unexpected error from server.
    '502':
      description: Bad Gateway (Proveedor LLM).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            provider-error:
              value:
                messages:
                  - code: BAD_GATEWAY
                    message: Upstream error
                    type: ERROR
                    description: Provider returned invalid JSON or 5xx.
    '503':
      description: Service Unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            provider-down:
              value:
                messages:
                  - code: SERVICE_UNAVAILABLE
                    message: Provider unavailable
                    type: ERROR
                    description: Dependency is down or maintenance mode.
    '504':
      description: Gateway Timeout (Proveedor LLM).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            timeout:
              value:
                messages:
                  - code: GATEWAY_TIMEOUT
                    message: Timeout
                    type: ERROR
                    description: Timeout waiting for provider response.

security:
  - bearerAuth: []
