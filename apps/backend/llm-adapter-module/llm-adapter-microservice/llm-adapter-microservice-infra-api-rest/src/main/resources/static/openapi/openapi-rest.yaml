openapi: 3.0.3
info:
  title: Revplan LLM Adapter Service API
  description: >
    Microservicio interno que orquesta llamadas al proveedor LLM (p. ej. OpenAI/Azure OpenAI)
    para generar planes en formato JSON (validación por JSON Schema), gestionar plantillas de prompt,
    consultar precios/catálogo de modelos, y exponer utilidades de validación y streaming SSE.
  contact:
    name: Revplan Team
    email: andresgb01@icloud.com
  version: '0.0.3'

servers:
  - url: '{protocol}://{host}:{port}/{basePath}/{majorVersion}'
    variables:
      protocol:
        description: Protocol.
        enum: ['http','https']
        default: 'http'
      host:
        description: Host.
        enum: ['localhost','llm-adapter.revplan.local']
        default: 'localhost'
      port:
        description: Port.
        default: '8083'
      basePath:
        description: BasePath.
        default: llm-adapter-service
      majorVersion:
        description: MajorVersion.
        default: v0

tags:
  - name: Models
    description: Catálogo de modelos LLM disponibles y sus capacidades.
  - name: Prompts
    description: CRUD de plantillas de prompt con variables tipadas.
  - name: Schemas
    description: Esquemas JSON y utilidades de validación.
  - name: Generate
    description: Generación de salida (JSON) con validación de schema y streaming opcional.
  - name: Health
    description: Salud, límites y diagnóstico de conectividad con el proveedor.
  - name: Billing
    description: Catálogo de precios por modelo/servicio (tokens, herramientas, imágenes, etc.).

paths:

  /models:
    parameters:
      - $ref: '#/components/parameters/Accept-Language-Header'
      - $ref: '#/components/parameters/X-Request-Id-Header'
    get:
      tags: [Models]
      summary: Lista modelos LLM disponibles (proveedor, límites y estado).
      description: Devuelve los modelos configurados con su ventana de contexto, modalidades y estado.
      operationId: getModels
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    minItems: 0
                    items: { $ref: '#/components/schemas/Model' }
                required: [data]
              examples:
                ok:
                  value:
                    data:
                      - id: gpt-4o-mini
                        provider: openai
                        contextWindow: 128000
                        maxOutputTokens: 16384
                        modalities: [text, structured_json]
                        status: active
                      - id: gpt-4o
                        provider: openai
                        contextWindow: 128000
                        maxOutputTokens: 32768
                        modalities: [text, structured_json]
                        status: active
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /prompts/templates:
    parameters:
      - $ref: '#/components/parameters/Accept-Language-Header'
      - $ref: '#/components/parameters/X-Request-Id-Header'
      - $ref: '#/components/parameters/Prompt-Name-Search'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Prompts]
      summary: Lista plantillas de prompt (con filtros y paginación).
      description: Devuelve el listado de plantillas con posibilidad de filtrar por nombre.
      operationId: getPromptTemplates
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplateListData' }
              examples:
                ok:
                  value:
                    data:
                      - id: PLAN_JSON_V1
                        name: Plan JSON v1
                        systemPrompt: 'Eres un planificador financiero. Devuelve SOLO JSON al schema.'
                        userTemplate: |
                          PERFIL: {{profile}}
                          CUENTAS: {{accounts}}
                          GASTO_90D: {{spend}}
                          DEUDAS: {{debts}}
                          CATALOGO_PLANTILLAS: {{templates}}
                          INSTRUCCIONES: Devuelve SOLO JSON exacto al schema.
                        variables:
                          - name: profile
                            type: object
                            required: true
                            description: Perfil financiero agregado
                        protected: true
                    pagination:
                      offset: 0
                      limit: 20
                      totalElements: 1
                      totalPages: 1
                      pageNumber: 0
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    post:
      tags: [Prompts]
      summary: Crea una plantilla de prompt.
      description: Alta de una nueva plantilla con variables tipadas y prompts.
      operationId: createPromptTemplate
      requestBody:
        $ref: '#/components/requestBodies/PromptTemplateRequestBody'
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplateData' }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '409': { $ref: '#/components/responses/409' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /prompts/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/Accept-Language-Header'
      - $ref: '#/components/parameters/X-Request-Id-Header'
      - $ref: '#/components/parameters/Template-Id'
    get:
      tags: [Prompts]
      summary: Obtiene una plantilla por id.
      description: Devuelve el detalle de la plantilla indicada por id.
      operationId: getPromptTemplateById
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptTemplateData' }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    put:
      tags: [Prompts]
      summary: Actualiza una plantilla por id.
      description: Reemplaza por completo la plantilla indicada.
      operationId: updatePromptTemplate
      requestBody:
        $ref: '#/components/requestBodies/PromptTemplateRequestBody'
      responses:
        '204': { $ref: '#/components/responses/204' }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      tags: [Prompts]
      summary: Elimina una plantilla (si no está protegida/en uso).
      description: Borra la plantilla si no está marcada como protegida o en uso.
      operationId: deletePromptTemplate
      responses:
        '204': { $ref: '#/components/responses/204' }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /schemas/plan:
    get:
      tags: [Schemas]
      summary: Devuelve el JSON Schema oficial de salida del plan (LLM).
      description: JSON Schema empleado para validar la salida del LLM.
      operationId: getPlanOutputSchema
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanLLMOutputSchemaDoc' }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '500': { $ref: '#/components/responses/500' }

  /schemas/validate:
    post:
      tags: [Schemas]
      summary: Valida un JSON cualquiera contra un JSON Schema.
      description: Si no se envía `schema`, valida contra el schema oficial del plan.
      operationId: validateJsonAgainstSchema
      requestBody:
        $ref: '#/components/requestBodies/JsonValidateRequestBody'
      responses:
        '200':
          description: Resultado de la validación.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string, minLength: 1, example: '$.adjustments.saving_pct' }
                        message: { type: string, minLength: 1, example: 'must be <= 1' }
                required: [valid]
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '500': { $ref: '#/components/responses/500' }

  /plans/generate:
    post:
      tags: [Generate]
      summary: Genera JSON de plan usando plantilla de prompt y JSON Schema.
      description: >
        Llama al proveedor LLM con `response_format: json_schema`, valida la salida contra el
        schema del plan y devuelve el JSON válido.
      operationId: generatePlanJson
      parameters:
        - $ref: '#/components/parameters/Accept-Language-Header'
        - $ref: '#/components/parameters/X-Request-Id-Header'
      requestBody:
        $ref: '#/components/requestBodies/PlanGenerateLLMRequestBody'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
            X-Provider-Request-ID:
              description: Identificador de la petición en el proveedor LLM.
              schema:
                type: string
                minLength: 1
                maxLength: 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanLLMOutputData' }
              examples:
                ok:
                  value:
                    data:
                      template_id: EQUILIBRADO_50_30_20
                      adjustments:
                        saving_pct: 0.27
                        emergency_months: 7
                        envelopes:
                          fijos: 0.45
                          variables: 0.28
                          objetivos: 0.27
                      rationale: 'Priorizamos colchón y ligera subida de ahorro.'
                      alerts:
                        - 'Ajusta ocio si superas 10% del límite'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '502': { $ref: '#/components/responses/502' }
        '503': { $ref: '#/components/responses/503' }
        '504': { $ref: '#/components/responses/504' }
        '500': { $ref: '#/components/responses/500' }

  /plans/generate/stream:
    post:
      tags: [Generate]
      summary: Genera en streaming (SSE) para observabilidad/tokens en tiempo real.
      description: Devuelve un stream SSE con fragmentos (chunks) y evento final con metadatos.
      operationId: generatePlanJsonStream
      requestBody:
        $ref: '#/components/requestBodies/PlanGenerateLLMRequestBody'
      responses:
        '200':
          description: Event stream abierto.
          headers:
            Content-Type:
              schema:
                type: string
                enum: ['text/event-stream']
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                sample:
                  summary: Flujo SSE de ejemplo
                  value: |
                    event: chunk
                    data: {"delta":"{\"template_id\":\"EQU..."}
                    event: chunk
                    data: {"delta":"..."}
                    event: finish
                    data: {"providerRequestId":"req_abc123","durationMs":842}
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '502': { $ref: '#/components/responses/502' }
        '504': { $ref: '#/components/responses/504' }
        '500': { $ref: '#/components/responses/500' }

  /health/llm:
    get:
      tags: [Health]
      summary: Comprobación de conectividad con el proveedor LLM.
      description: Realiza una verificación simple de latencia y reachability del proveedor LLM.
      operationId: healthLLM
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, minLength: 2, example: openai }
                  reachable: { type: boolean, example: true }
                  modelLatencyMs: { type: integer, minimum: 0, example: 123 }
                  timestamp: { type: string, format: date-time }
                required: [provider, reachable, timestamp]
        '500': { $ref: '#/components/responses/500' }

  /limits:
    get:
      tags: [Health]
      summary: Límite de uso y ventana de rate limit conocida.
      description: Devuelve límites estimados y cabeceras de rate limit.
      operationId: getLimits
      responses:
        '200':
          description: OK.
          headers:
            X-RateLimit-Limit:
              description: Límite de peticiones por minuto conocido.
              schema: { type: integer, minimum: 1, example: 3500 }
            X-RateLimit-Remaining:
              description: Peticiones restantes en la ventana.
              schema: { type: integer, minimum: 0, example: 3492 }
            X-RateLimit-Reset:
              description: Epoch seconds para reset.
              schema: { type: integer, minimum: 0, example: 1723948800 }
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  limitPerMinute: { type: integer, minimum: 1 }
                  estimatedUsageMinute: { type: integer, minimum: 0 }
                  burstAllowed: { type: integer, minimum: 0 }
                required: [limitPerMinute]
              examples:
                ok:
                  value:
                    limitPerMinute: 3500
                    estimatedUsageMinute: 8
                    burstAllowed: 50
        '500': { $ref: '#/components/responses/500' }

  /billing/prices:
    get:
      tags: [Billing]
      summary: Catálogo de precios del proveedor por modelo/servicio.
      description: >
        Devuelve un snapshot del catálogo de precios público del proveedor seleccionado.
        Los importes se devuelven en la moneda indicada (por defecto USD).
      operationId: getBillingPrices
      parameters:
        - $ref: '#/components/parameters/Accept-Language-Header'
        - $ref: '#/components/parameters/X-Request-Id-Header'
        - name: provider
          in: query
          required: false
          description: Proveedor deseado.
          schema:
            type: string
            enum: [openai, azure_openai]
            default: openai
        - name: tier
          in: query
          required: false
          description: Tarifa de procesamiento.
          schema:
            type: string
            enum: [standard, batch, flex, priority]
            default: standard
        - name: currency
          in: query
          required: false
          description: Moneda de salida en código ISO 4217 (solo `USD` soportado inicialmente).
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            minLength: 3
            maxLength: 3
            default: USD
        - name: includeLegacy
          in: query
          required: false
          description: Incluir modelos legacy en la respuesta.
          schema:
            type: boolean
            default: true
        - name: effectiveDate
          in: query
          required: false
          description: Fecha del snapshot deseado (si se omite, el más reciente).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestIdHeader' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PriceCatalog' }
                required: [data]
              examples:
                openai-standard:
                  summary: Catálogo OpenAI - tier standard (USD)
                  value:
                    data:
                      provider: openai
                      tier: standard
