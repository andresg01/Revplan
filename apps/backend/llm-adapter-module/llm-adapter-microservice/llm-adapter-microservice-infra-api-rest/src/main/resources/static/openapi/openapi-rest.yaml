                              price: { input: 0.15, cachedInput: 0.075, output: 0.60 }
                            - modelId: gpt-4o-mini-audio-preview
                              price: { input: 0.15, output: 0.60 }
                            - modelId: gpt-4o-mini-realtime-preview
                              price: { input: 0.60, cachedInput: 0.30, output: 2.40 }
                            - modelId: o1
                              price: { input: 15.00, cachedInput: 7.50, output: 60.00 }
                            - modelId: o1-pro
                              price: { input: 150.00, output: 600.00 }
                            - modelId: o3
                              price: { input: 2.00, cachedInput: 0.50, output: 8.00 }
                            - modelId: o3-pro
                              price: { input: 20.00, output: 80.00 }
                            - modelId: o3-deep-research
                              price: { input: 10.00, cachedInput: 2.50, output: 40.00 }
                            - modelId: o4-mini
                              price: { input: 1.10, cachedInput: 0.275, output: 4.40 }
                            - modelId: o4-mini-deep-research
                              price: { input: 2.00, cachedInput: 0.50, output: 8.00 }
                        imageTokens:
                          unit: PER_1M_TOKENS
                          items:
                            - modelId: gpt-image-1
                              price: { input: 10.00, cachedInput: 2.50, output: 40.00 }
                        audioTokens:
                          unit: PER_1M_TOKENS
